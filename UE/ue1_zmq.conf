#####################################################################
#                   srsUE configuration file (UE1)
#####################################################################
# Configuration for srsRAN_4G UE1 to connect to srsRAN_Project gNB
# via ZMQ interface for testing and development.
# UE1 uses the second ZMQ port pair from DU (tx_port1/rx_port1)
#####################################################################

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
# UE1 ZMQ configuration: UE1 tx connects to DU rx_port1, UE1 rx connects to DU tx_port1
device_args = tx_port=tcp://10.53.1.252:6100,rx_port=tcp://10.53.1.250:5100,id=ue1,base_srate=23.04e6


[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = none
mac_filename = /tmp/ue1_mac.pcap
mac_nr_filename = /tmp/ue1_mac_nr.pcap
nas_filename = /tmp/ue1_nas.pcap

[log]
all_level = info
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue1.log
file_max_size = -1
rf_level = /tmp/rf_ue1.log

[usim]
mode = soft
algo = milenage
opc  = 63BFA50EE6523365FF14C1F45F88737D
k    = 00112233445566778899aabbccddeeff
# UE1 uses unique IMSI/IMEI values (incremented from UE0)
# UE0: IMSI=001010123456780, IMEI=353490069873319
imsi = 001010123456781
imei = 353490069873320

[rrc]
release = 15
ue_category = 4

[nas]
apn = srsapn
apn_protocol = ipv4

#[gw]
#netns = ue1
# ip_devname = tun_srsue
# ip_netmask = 255.255.255.0

[gui]
enable = false
